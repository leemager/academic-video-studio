<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1ebdf;color:#202324;font:18px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:72px auto;padding:0 32px}header{border-top:5px solid #176b70;padding-top:28px}h1{font:normal clamp(36px,5vw,64px)/1.05 Georgia,serif;max-width:850px;margin:12px 0 30px}p{max-width:900px}.intro{color:#645e58}blockquote{margin:40px 0 56px;padding:0 0 0 28px;border-left:2px solid #176b70;font:27px/1.5 Georgia,serif}.take{border-top:1px solid #c9c1b4;padding:28px 0;display:grid;grid-template-columns:180px 1fr;gap:24px}h2{font:normal 32px Georgia;margin:0 0 10px}.note{font-size:16px;color:#645e58;margin:0 0 15px}audio{width:100%;display:block;margin:0 0 20px}button{border:1px solid #176b70;border-radius:4px;padding:12px 22px;color:#176b70;background:transparent;font:inherit;cursor:pointer}button:hover,button.chosen{background:#176b70;color:#fff}button:focus-visible{outline:3px solid #172e4b;outline-offset:3px}#status{min-height:60px;margin-top:25px;color:#176b70}code{font-size:13px;color:#716b64}footer{border-top:1px solid #c9c1b4;margin-top:40px;padding:24px 0;font-size:16px;color:#645e58}@media(max-width:650px){.take{grid-template-columns:1fr}main{margin:30px auto}blockquote{font-size:23px}}
</style><main><header><p class="intro">Voice review</p><h1 id="title">Loading the audition…</h1><p>Listen to each complete passage, then choose the version that sounds most like you. Your choice is saved for Codex to use in the video.</p></header><blockquote id="text"></blockquote><section id="takes" aria-label="Audio alternatives"></section><p id="status" role="status" aria-live="polite"></p><footer>These are generated voice samples. Choosing a take preserves its exact audio; it does not regenerate it.</footer></main>
<script>
const token='__TOKEN__';
fetch('/manifest').then(r=>r.json()).then(m=>{document.querySelector('#title').textContent=m.title;document.querySelector('#text').textContent=m.text;for(const t of m.takes){const row=document.createElement('article');row.className='take';const label=document.createElement('div'),h=document.createElement('h2');h.textContent=t.label;label.append(h);const hash=document.createElement('code');hash.textContent=t.sha256.slice(0,12);label.append(hash);row.append(label);const content=document.createElement('div');if(t.note){const note=document.createElement('p');note.className='note';note.textContent=t.note;content.append(note);}const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src='/audio/'+t.file;a.setAttribute('aria-label',t.label);a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(o=>{if(o!==a)o.pause()}));content.append(a);const button=document.createElement('button');button.textContent='Use '+t.label;button.onclick=async()=>{const r=await fetch('/choose',{method:'POST',headers:{'Content-Type':'application/json','X-Audition-Token':token},body:JSON.stringify({id:t.id})});if(!r.ok){document.querySelector('#status').textContent='The choice could not be saved. Please tell Codex.';return;}const selected=await r.json();document.querySelectorAll('button').forEach(b=>b.classList.remove('chosen'));button.classList.add('chosen');document.querySelector('#status').textContent=t.label+' saved. Return to Codex and ask it to apply this choice. '+selected.saved;};content.append(button);row.append(content);document.querySelector('#takes').append(row);}}).catch(()=>document.querySelector('#status').textContent='Could not load this audition. Please tell Codex.');
</script></html>
